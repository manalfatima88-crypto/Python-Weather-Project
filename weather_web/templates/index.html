<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <style>
    body { font-family: sans-serif; background: #dbeafe; padding: 16px; }
    .card { background: white; color: #111; max-width: 360px; margin: auto;
            padding: 20px; border-radius: 16px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px;
                    margin-top: 10px; font-size: 16px; border-radius: 8px; }
    button { background: #2563eb; color: white; border: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌤️ Weather App</h2>
    <form>
      <input name="city" placeholder="City" required>
      <input name="country" placeholder="Country (optional)">
      <button>Get Weather</button>
    </form>
    {% if error %}<p>{{ error }}</p>{% endif %}
    {% if data %}
      <h3>{{ data.place.name }}, {{ data.place.country }}</h3>
      <p>Temperature: {{ data.now.temperature_2m }} °C</p>
      <p>Wind: {{ data.now.wind_speed_10m }} km/h</p>
      <p>Humidity: {{ data.now.relative_humidity_2m }} %</p>
    {% endif %}
  </div>
</body>
</html>
